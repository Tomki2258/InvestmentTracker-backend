$kind: http-request
name: Login
url: https://localhost:7286/login
method: POST
body:
  type: json
  content: |-
    {
      "email": "tomek@proton.mail",
      "password": "tomek"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      const token = response.token || response.Token;

      if (token) {
          pm.collectionVariables.set("jwt_token", token);
          console.log("Token zapisany pomyślnie:", token);
      } else {
          console.error("Nie znaleziono tokenu w odpowiedzi! Struktura odpowiedzi:", response);
      }
    language: text/javascript
order: 1781962561588
